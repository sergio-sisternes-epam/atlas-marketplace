name: atlas
version: 0.1.0
description: Private Atlas APM marketplace (registry only)
author: sergio-sisternes-epam
license: Apache-2.0

marketplace:
  owner:
    name: sergio-sisternes-epam
    url: https://github.com/sergio-sisternes-epam
  outputs:
    - claude
  packages:
    - name: okf
      description: Open Knowledge Format — pure format standard and validator (Grok-native skill)
      source: sergio-sisternes-epam/okf
      version: 0.2.1
      ref: 5246f7b193b58a32ac8a15fc76aedf37c42b042c
    - name: atlas
      description: Durable OKF v0.2 knowledge substrate for process memory, schema governance, project knowledge graphs, and canonical CI gates on Atlas mounts
      source: sergio-sisternes-epam/atlas
      version: 0.12.0
      ref: 40e11c65e243236850c26fc6cd5a04acdd483eb4
    - name: discuss
      description: Run a durable discussion about a clear subject as an agent-maintained Atlas graph. Persist, prune, and test forming ideas. Not for implementation.
      source: sergio-sisternes-epam/discuss
      version: 0.4.0
      ref: af2d2fa4759c00d4ae77115c0fe710c439f8c958
    - name: think
      description: think-ramble, think-grill, and think-challenge thinking primitives. Conversation-only when no durable store is present.
      source: sergio-sisternes-epam/think
      version: 0.1.0
      ref: 874613a67018c74ee95f857416fb315d2f80b92b
    - name: atlas-cartograph
      description: Live Atlas knowledge-graph canvas for GitHub Copilot App
      source: sergio-sisternes-epam/atlas-cartograph
      version: 0.4.2
      ref: 9dcb9347f0c66d20a9607d2adc0474b69dd004f6
    - name: autogenesis
      description: Grows a skillset from its own experience store. Core design process is genesis; memory via Atlas. Grok-native APM skill.
      source: sergio-sisternes-epam/autogenesis
      version: 0.7.0
      ref: 9b8763a362d69faf3eeb99612cd307078c19a881
