name: atlas
version: 0.1.0
description: "Public Atlas APM marketplace (registry only). It indexes external packages and their dependencies; it does not vendor their source."
author: sergio-sisternes-epam
license: Apache-2.0

marketplace:
  owner:
    name: sergio-sisternes-epam
    url: https://github.com/sergio-sisternes-epam
  outputs:
    - claude
  packages:
    - name: okf
      description: "Open Knowledge Format — an APM package that distributes the pure OKF format standard and validator."
      source: sergio-sisternes-epam/okf
      version: 0.2.1
      ref: v0.2.1
    - name: atlas
      description: "Atlas is a distributed Semantic Knowledge Network built with technologies LLMs already know: git and markdown, with a SCHEMA and a CLI that keep agents inside pre-defined, extensible domains."
      source: sergio-sisternes-epam/atlas
      version: 0.12.0
      ref: v0.12.0
    - name: discuss
      description: "Run a discussion as a durable, agent-maintained Atlas graph. Fill the gaps in your thinking with this companion skill that explores the graph for you, finds where they are, and proposes solutions."
      source: sergio-sisternes-epam/discuss
      version: 0.4.0
      ref: v0.4.0
    - name: think
      description: "One install gives nine agent harnesses three ways to think: capture ideas, interrogate assumptions, and challenge claims with sources."
      source: sergio-sisternes-epam/think
      version: 0.1.0
      ref: v0.1.0
    - name: atlas-cartograph
      description: "Cartograph is an Atlas knowledge-graph viewer for the GitHub Copilot App."
      source: sergio-sisternes-epam/atlas-cartograph
      version: 0.4.2
      ref: v0.4.2
    - name: autogenesis
      description: "Autogenesis is an expanded discipline of danielmeppiel/genesis that uses Atlas as long-term memory for the skill, wherever it is used, pairs with skills such as discuss and think and incorporates minor new patterns and disciplines, such as Activation Cards, Modules, or a skill-native SOLID design lens."
      source: sergio-sisternes-epam/autogenesis
      version: 0.7.0
      ref: v0.7.0
